target_workbook: ../FinanceWorkbook.xlsx
log_dir: ../FinPulseImportLogs
details_sheet: Details
workbook:
  columns:
    bank: "Bank"
    account: "Account"
    date: "Date"
    description: "Transaction Description"
    withdrawals: "Withdrawals"
    deposits: "Deposits"
    transaction_type: "Transaction Type"
    accrual_period: "Accrual period"
    human_verified: "Human Verified"
    notes: "Notes"
    category: "Category"
    subcategory: "Subcategory"
    automated_category: "Automated Trans. Category"
  transaction_type_labels:
    withdrawal: "Withdrawal"
    deposit: "Deposit"
sources:
  BECU - Member Shared Savings:
    bank_label: BECU
    account_label: Member Shared Savings
    account_sheet: BECU Member Shared Savings
    files:
    - ../Inputs/BECU - Member Shared Savings/*.csv
    auto_raw_from_sheet: true
    debit_col: Debit
    credit_col: Credit
    debit_credit_are_signed: true #this is the default anyway, so not including it for the next accounts (unless the account requires false)
    date_col: "Date"
    date_format: "%m/%d/%y"     # or "%m/%d/%Y" if the CSV uses four-digit year
  Chase - Checkings:
    bank_label: Chase
    account_label: Checkings
    account_sheet: Chase Checkings
    files:
      - ../Inputs/Chase - Checkings/*.csv      # keep
    auto_raw_from_sheet: true
    # Explicit mapping for normalization:
    date_col: Posting Date
    date_format: "%m/%d/%y"
    description_col: Description
  Chase - Freedom Credit Card:
    bank_label: Chase
    account_label: Freedom Credit Card
    account_sheet: Chase Freedom Credit Card
    files:
    - ../Inputs/Chase - Freedom Credit Card/*.csv
    auto_raw_from_sheet: true
    # Explicit mapping for normalization:
    date_col: Transaction Date
    date_format: "%m/%d/%y"
    description_col: Description
    automated_trans_cat_col: Category
  Chase - Prime Visa:
    bank_label: Chase
    account_label: Prime Visa
    account_sheet: Chase Prime Visa
    files:
    - ../Inputs/Chase - Prime Visa/*.csv
    auto_raw_from_sheet: true
    # Explicit mapping for normalization:
    date_col: Transaction Date
    date_format: "%m/%d/%y"
    description_col: Description
    automated_trans_cat_col: Category
  First Tech - Checkings:
    bank_label: First Tech
    account_label: Checkings
    account_sheet: First Tech Checkings
    files:
    - ../Inputs/First Tech - Checkings/*.csv
    auto_raw_from_sheet: true
    # Explicit mapping for normalization:
    date_col: Posting Date
    date_format: "%m/%d/%y"
    description_col: Description
  First Tech - Choice Credit Card:
    bank_label: First Tech
    account_label: Choice Credit Card
    account_sheet: First Tech Choice Credit Card
    files:
    - ../Inputs/First Tech - Choice Credit Card/*.csv
    auto_raw_from_sheet: true
    # Explicit mapping for normalization:
    date_col: Posting Date
    date_format: "%m/%d/%y"
    description_col: Description
    automated_trans_cat_col: Transaction Category
  First Tech - Savings:
    bank_label: First Tech
    account_label: Savings
    account_sheet: First Tech Rewards Savings
    files:
    - ../Inputs/First Tech - Savings/*.csv
    auto_raw_from_sheet: true
    # Explicit mapping for normalization:
    date_col: Posting Date
    date_format: "%m/%d/%y"
    description_col: Description
    automated_trans_cat_col: Transaction Category
  First Tech - Certificate 4926:
    bank_label: First Tech
    account_label: Certificate 4926
    account_sheet: First Tech Certificate 4926
    files:
      - ../Inputs/First Tech - Certificate 4926/*.csv
    auto_raw_from_sheet: true
    # Explicit mapping for normalization:
    date_col: Posting Date
    date_format: "%m/%d/%y"
    description_col: Description
    automated_trans_cat_col: Type
  First Tech - Certificate 6570:
    bank_label: First Tech
    account_label: Certificate 6570
    account_sheet: First Tech Certificate 6570
    files:
      - ../Inputs/First Tech - Certificate 6570/*.csv
    auto_raw_from_sheet: true
    # Explicit mapping for normalization:
    date_col: Posting Date
    date_format: "%m/%d/%y"
    description_col: Description
    automated_trans_cat_col: Type
ml:
  models_dir: "src/finpulse/ml/models"
  metadata_file: "metadata.yaml"
  text_encoder: sbert           # or "tfidf"
  category_model:
    algorithm: logistic_regression
    features:
      - "Transaction Description"
      - "Transaction Type"
    hyperparameters:
      solver: lbfgs
      penalty: l2
      C: 6.0
      max_iter: 1000
      class_weight: balanced
      n_jobs: -1
      random_state: 42

  subcategory_model:
    algorithm: random_forest
    features:
      - "Transaction Description"
      - "Automated Trans. Category"
      - "Transaction Type"
    hyperparameters:
      n_estimators: 500
      max_depth: 20
      min_samples_split: 2
      min_samples_leaf: 2
      max_features: sqrt
      class_weight: balanced
      n_jobs: -1
      random_state: 42
  rare_label_threshold: 10
